version: '3.8'

services:
  backend:
    build:
      context: ./projet-ebanking-ebankingSecuredDev/projet-ebanking-ebankingSecuredDev
      dockerfile: Dockerfile
    container_name: ebanking-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://ebanking.c0x6q2u2yn60.us-east-1.rds.amazonaws.com:5432/ebanking
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: youssef123
    ports:
      - "8080:8080"
    restart: on-failure

  frontend:
    build:
      context: ./projet-ebanking-EbankingDevFront/projet-ebanking-EbankingDevFront
      dockerfile: Dockerfile
    container_name: ebanking-frontend
    ports:
      - "4200:4200"
    depends_on:
      - backend
    restart: on-failure

  frontend-admin:
    build:
      context: ./projet-ebanking-admin-front
      dockerfile: Dockerfile
    container_name: ebanking-frontend-admin
    ports:
      - "4100:4100"
    depends_on:
      - backend
    restart: on-failure
